<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D161F"/>
      <stop offset="100%" stop-color="#070F15"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D5"/>
      <stop offset="100%" stop-color="#008082"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E05D0F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Outer Pipe Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-dasharray="1000" filter="url(#glow)"/>
  
  <!-- Inner Pipe Wall -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="12"/>
  
  <!-- Metal Loss Defect / Feature Indicator -->
  <path d="M 256 76 A 180 180 0 0 1 383 129 L 350 162 A 132 132 0 0 0 256 124 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
  
  <!-- Ultrasonic Inspection Pulse Wave -->
  <path d="M 120 256 L 180 256 L 210 200 L 240 312 L 272 170 L 302 330 L 332 256 L 392 256" fill="none" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Digital Sensor Core Dot -->
  <circle cx="256" cy="256" r="16" fill="#00D2D5"/>
  <circle cx="256" cy="256" r="32" fill="none" stroke="#00D2D5" stroke-width="4" opacity="0.6"/>
</svg>